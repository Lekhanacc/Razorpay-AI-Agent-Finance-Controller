<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Razorpay AI Agent</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">

            <div class="logo">
                <div class="logo-icon">R</div>

                <div>
                    <h1>Razorpay AI Agent</h1>
                    <p>Payments Assistant</p>
                </div>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                AI Online
            </div>

        </header>


        <main class="chat-container">

            <div id="messages" class="messages">

                <div class="message bot">

                    <div class="avatar">AI</div>

                    <div class="bubble">

                        <div class="message-title">
                            Razorpay AI Agent
                        </div>

                        <p>
                            Hi! 👋 I can help you with payments,
                            payment failures, refunds, transactions,
                            settlements and payment status.
                        </p>

                    </div>

                </div>

            </div>


            <div id="loading" class="loading hidden">

                <div class="avatar">AI</div>

                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>


            <div class="input-area">

                <input
                    id="userInput"
                    type="text"
                    placeholder="Ask about a payment..."
                    autocomplete="off"
                >

                <button id="sendButton">
                    Send
                </button>

            </div>

            <div class="hint">
                Try: "Why did my payment fail?"
            </div>

        </main>

    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>

</body>

</html>
